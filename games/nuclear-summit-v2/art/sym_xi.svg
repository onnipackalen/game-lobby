<path d="M44 130 Q48 168 72 188 Q86 196 100 198 Q114 196 128 188 Q152 168 156 130 Q150 160 126 176 Q112 184 100 184 Q88 184 74 176 Q50 160 44 130 Z" fill="#DDA236"/>
<path class="ol" d="M40 112 Q38 52 100 42 Q162 52 160 112 Q162 160 140 182 Q122 198 100 198 Q78 198 60 182 Q38 160 40 112 Z" fill="none"/>
<!-- jet-black hair combed back, side part -->
<path class="ol" d="M50 94 Q46 52 100 40 Q154 52 150 94 Q144 80 128 76 Q110 72 92 74 Q70 76 58 88 Z" fill="#141418"/>
<path d="M78 48 Q73 64 71 82" stroke="#40404a" stroke-width="2.2" stroke-linecap="round" fill="none"/>
<path d="M90 52 Q118 46 142 60" stroke="#4E4E5A" stroke-width="4" stroke-linecap="round" fill="none"/>
<path d="M86 64 Q114 58 144 70 M58 70 Q64 60 74 56" stroke="#2E2E36" stroke-width="2" stroke-linecap="round" fill="none"/>
