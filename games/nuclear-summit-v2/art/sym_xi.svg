<path d="M66 100 Q80 95 94 100 M106 100 Q120 95 134 100" stroke="#1A1A1E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
<!-- calm narrow eyes, built like every other leader's -->
<path d="M70 113 Q81 107 92 112 Q81 117 70 113 Z" fill="#F7F1EA"/>
<circle cx="81" cy="112.3" r="3.6" fill="#2A2018"/><circle cx="82" cy="111.4" r="0.9" fill="#ffffff"/>
<path class="il" d="M68 112 Q81 104 94 111" style="stroke-width:2.4"/>
<path class="il" d="M72 119 Q81 122 90 118"/>
<path d="M108 112 Q119 107 130 113 Q119 117 108 112 Z" fill="#F7F1EA"/>
<circle cx="119" cy="112.3" r="3.6" fill="#2A2018"/><circle cx="120" cy="111.4" r="0.9" fill="#ffffff"/>
<path class="il" d="M106 111 Q119 104 132 112" style="stroke-width:2.4"/>
<path class="il" d="M110 118 Q119 122 128 119"/>
