<ellipse cx="136" cy="142" rx="11" ry="7" fill="#EBA046" opacity="0.7"/>
<!-- bear muzzle, nose and a composed smile -->
<ellipse class="il" cx="100" cy="150" rx="28" ry="20" fill="#F8DA8C"/>
<ellipse cx="100" cy="137" rx="10" ry="7" fill="#3A2A1A"/>
<ellipse cx="97" cy="135" rx="3" ry="1.6" fill="#7a6450"/>
<path class="il" d="M100 144 L100 153 M86 153 Q100 162 114 153" style="stroke-width:2.2"/>
<path class="il" d="M86 186 Q100 192 114 186" style="stroke:#a8741f"/>
