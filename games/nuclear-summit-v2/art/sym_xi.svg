<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250">
<style>.ol{stroke:#3b2a22;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.il{fill:none;stroke:#3b2a22;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}</style>
<!-- Winnie the Xi. An original honey bear (not any existing cartoon character) given Xi's look:
     front-facing official-portrait pose, broad round face, jet-black hair combed back with a side part,
     calm narrow eyes, composed closed-mouth smile, dark suit, white shirt, burgundy tie. -->
<!-- tier tile -->
<circle class="ol" cx="100" cy="124" r="96" fill="#D7263D"/>
<ellipse cx="78" cy="62" rx="48" ry="26" fill="#F0606F" opacity="0.45"/>
