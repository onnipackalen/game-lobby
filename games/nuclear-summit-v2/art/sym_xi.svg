<path d="M150 196 Q186 208 194 234 L196 250 L166 250 Q166 222 144 206 Z" fill="#1F2025"/>
<path class="ol" d="M80 194 L100 222 L120 194 L116 188 L100 208 L84 188 Z" fill="#FFFFFF" style="stroke-width:2.2"/>
<path class="il" d="M80 194 L68 250 M120 194 L132 250" style="stroke:#141518"/>
<path class="ol" d="M95 206 L105 206 L103 216 L97 216 Z" fill="#7E1F22" style="stroke-width:2"/>
<path class="ol" d="M97 216 L103 216 L108 250 L92 250 Z" fill="#9E2A2B" style="stroke-width:2"/>
<!-- round bear ears -->
<circle class="ol" cx="50" cy="62" r="20" fill="#E9B13B"/><circle cx="50" cy="62" r="10" fill="#D4962A"/>
<circle class="ol" cx="150" cy="62" r="20" fill="#E9B13B"/><circle cx="150" cy="62" r="10" fill="#D4962A"/>
