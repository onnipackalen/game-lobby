<path d="M40 60 Q32 70 40 80 Q30 78 30 70 Q30 62 40 60 Z" fill="#FFE9A8"/>
<!-- Zzz -->
<path d="M156 48 L165 48 L156 59 L165 59 M168 28 L180 28 L168 43 L180 43 M178 6 L194 6 L178 24 L194 24" stroke="#BFD3FF" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
