<path class="il" d="M78 196 L66 250 M124 194 L136 250" style="stroke:#18243a"/>
<path class="ol" d="M94 208 L106 208 L104 218 L96 218 Z" fill="#5C93CC" style="stroke-width:2"/>
<path class="ol" d="M96 218 L104 218 L110 250 L90 250 Z" fill="#7FB3E6" style="stroke-width:2"/>
<!-- ear -->
<path class="ol" d="M58 110 Q40 104 40 126 Q40 148 60 152 Z" fill="#F0CDB0"/>
<path class="il" d="M50 118 Q45 128 50 142"/>
