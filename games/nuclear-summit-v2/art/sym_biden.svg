<path d="M60 88 Q58 50 92 34 Q126 22 152 42 Q168 58 166 88 Q168 110 166 132 Q164 164 150 182 Q134 198 112 198 Q88 196 74 180 Q60 162 58 134 Q56 108 60 88 Z" fill="#F0CDB0"/>
