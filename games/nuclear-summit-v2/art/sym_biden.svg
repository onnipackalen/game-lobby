<circle cx="178" cy="163" r="1.6" fill="#6b3f2a"/><circle cx="188" cy="170" r="1.6" fill="#6b3f2a"/><circle cx="182" cy="174" r="1.6" fill="#6b3f2a"/>
<path d="M176 140 Q180 136 186 138" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" fill="none"/>
