<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250">
<style>.ol{stroke:#3b2a22;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.il{fill:none;stroke:#3b2a22;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}</style>
<!-- Sleepy Joe. Head and shoulders, 3/4 view facing right, cel-shaded.
     Identity: thin white hair swept back from a receding hairline, his trademark aviators on,
     snoozing behind them (Zzz, mouth open), holding up a big double-scoop ice cream cone. -->
