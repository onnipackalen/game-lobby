<path d="M98 116 Q96 134 95 146 L101 148 Q101 134 103 116 Z" fill="#C9976F"/>
<path class="ol" d="M60 92 Q60 80 72 78 L128 78 Q140 80 140 92 Q144 120 140 142 Q136 168 122 182 Q110 192 100 192 Q90 192 78 182 Q64 168 60 142 Q56 120 60 92" fill="none"/>
<!-- creased forehead -->
<path class="il" d="M74 91 Q100 86 126 91 M78 98 Q100 94 122 98 M96 100 L95 106 M104 100 L105 106" style="stroke:#a87b5a"/>
<!-- narrow glare under heavy drooping white brows -->
<path d="M72 114 Q81 109 90 113 Q81 117 72 114 Z" fill="#F4EEE6"/>
