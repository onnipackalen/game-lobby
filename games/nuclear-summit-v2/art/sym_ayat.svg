<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250">
<style>.ol{stroke:#3b2a22;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.il{fill:none;stroke:#3b2a22;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}</style>
<!-- The ayatollah. Head and shoulders, front view, cel-shaded.
     Identity from his public look: a huge black turban sitting low on the brow, a long gaunt face with
     sunken cheeks and a creased forehead, heavy drooping white brows over a narrow glare, a long white
     beard, a dark robe with his black-and-white checked scarf. Dress drawn plainly and respectfully;
     the jokes are the glare, the drone buzzing past and the pride-colours tile.
     Nose drawn with the same proportions as every other leader's. -->
<defs>
  <clipPath id="ayatTile"><path d="M36 20 L164 20 Q192 20 192 48 L192 140 Q192 196 100 234 Q8 196 8 140 L8 48 Q8 20 36 20 Z"/></clipPath>
  <pattern id="ayatCheck" width="9" height="9" patternUnits="userSpaceOnUse">
    <rect width="9" height="9" fill="#EDEDED"/><path d="M0 0 L9 9 M9 0 L0 9" stroke="#1E1A18" stroke-width="2"/>
  </pattern>
</defs>
<!-- pride-colours tile (v2: a shield in pastel, mid-tier saturation): a jab at the regime's persecution of LGBTQ people -->
<g clip-path="url(#ayatTile)"><rect x="8" y="20" width="184" height="37" fill="#F07878"/><rect x="8" y="56" width="184" height="37" fill="#FFC27A"/><rect x="8" y="92" width="184" height="37" fill="#FFF080"/><rect x="8" y="128" width="184" height="37" fill="#78BC8C"/><rect x="8" y="164" width="184" height="37" fill="#7AA2FF"/><rect x="8" y="200" width="184" height="37" fill="#B67CC0"/></g>
<path class="ol" d="M36 20 L164 20 Q192 20 192 48 L192 140 Q192 196 100 234 Q8 196 8 140 L8 48 Q8 20 36 20 Z" fill="none"/>
<!-- dark robe with the checked scarf -->
<path class="ol" d="M4 250 Q8 206 44 194 Q72 186 100 188 Q128 186 156 194 Q192 206 196 250 Z" fill="#1E1A18"/>
<path class="ol" d="M40 198 Q58 190 72 196 L80 250 L44 250 Q48 222 40 198 Z" fill="url(#ayatCheck)" style="stroke-width:2.2"/>
<path class="ol" d="M160 198 Q142 190 128 196 L120 250 L156 250 Q152 222 160 198 Z" fill="url(#ayatCheck)" style="stroke-width:2.2"/>
<!-- ears -->
<path class="ol" d="M60 112 Q44 108 44 126 Q44 144 62 146 Z" fill="#E3B892"/>
<path class="ol" d="M140 112 Q156 108 156 126 Q156 144 138 146 Z" fill="#E3B892"/>
<!-- long, gaunt face -->
