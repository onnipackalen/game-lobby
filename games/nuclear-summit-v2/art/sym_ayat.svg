<path class="ol" d="M28 88 Q16 30 70 10 Q100 0 130 10 Q184 30 172 88 Q150 76 100 76 Q50 76 28 88 Z" fill="#151515"/>
<path d="M38 68 Q100 40 162 68 M34 52 Q100 22 166 52 M50 32 Q100 12 150 32" stroke="#3E3E44" stroke-width="3" stroke-linecap="round" fill="none"/>
