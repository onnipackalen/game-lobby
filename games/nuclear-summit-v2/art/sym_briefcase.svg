<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250">
<style>.ol{stroke:#3b2a22;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}.il{fill:none;stroke:#3b2a22;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style>
<!-- The nuclear briefcase (lowest pay, v2): the black "football" that follows a leader everywhere,
     handcuffed to its carrier, with a gold seal. No tile, like the hotline, so it reads as a low pay.
     Black leather and gold keep it clear of the Mini Nuke (hazard orange) and the red hotline. -->
<g transform="translate(0 10)">
<!-- handcuff chain to the carrier's wrist -->
<circle cx="30" cy="44" r="13" fill="none" stroke="#3b2a22" stroke-width="9"/>
<circle cx="30" cy="44" r="13" fill="none" stroke="#C9CCD4" stroke-width="5"/>
<g fill="none" stroke="#3b2a22" stroke-width="7"><ellipse cx="45" cy="60" rx="7" ry="4.5" transform="rotate(45 45 60)"/><ellipse cx="56" cy="71" rx="7" ry="4.5" transform="rotate(45 56 71)"/><ellipse cx="67" cy="82" rx="7" ry="4.5" transform="rotate(45 67 82)"/></g>
<g fill="none" stroke="#C9CCD4" stroke-width="3.4"><ellipse cx="45" cy="60" rx="7" ry="4.5" transform="rotate(45 45 60)"/><ellipse cx="56" cy="71" rx="7" ry="4.5" transform="rotate(45 56 71)"/><ellipse cx="67" cy="82" rx="7" ry="4.5" transform="rotate(45 67 82)"/></g>
<!-- handle -->
<path d="M74 104 L74 86 Q74 72 88 72 L112 72 Q126 72 126 86 L126 104" fill="none" stroke="#3b2a22" stroke-width="15" stroke-linecap="round"/>
<path d="M74 104 L74 86 Q74 72 88 72 L112 72 Q126 72 126 86 L126 104" fill="none" stroke="#3A3A41" stroke-width="8" stroke-linecap="round"/>
<!-- case -->
<rect x="20" y="98" width="160" height="118" rx="18" fill="#2B2B31"/>
<path d="M146 98 L162 98 Q180 98 180 116 L180 198 Q180 216 162 216 L146 216 Z" fill="#1E1E23"/>
<path d="M36 112 L36 150" stroke="#55555E" stroke-width="6" stroke-linecap="round"/>
<rect x="20" y="146" width="160" height="10" fill="#1A1A1E"/>
<rect class="ol" x="20" y="98" width="160" height="118" rx="18" fill="none"/>
<!-- gold latches -->
<rect class="ol" x="46" y="92" width="24" height="16" rx="4" fill="#E2B93B" style="stroke-width:2.6"/>
<rect class="ol" x="130" y="92" width="24" height="16" rx="4" fill="#E2B93B" style="stroke-width:2.6"/>
<!-- gold seal with a star -->
<circle class="ol" cx="100" cy="182" r="26" fill="#E2B93B" style="stroke-width:3"/>
<circle cx="100" cy="182" r="19" fill="#B8902C"/>
<path d="M100 167 L104.4 177 L115.2 178 L107 185.2 L109.4 195.8 L100 190.2 L90.6 195.8 L93 185.2 L84.8 178 L95.6 177 Z" fill="#FFE28A" stroke="#3b2a22" stroke-width="1.6" stroke-linejoin="round"/>
</g>
</svg>
