<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" preserveAspectRatio="xMidYMid slice">
<!-- Base-game background: "The Summit Hall".
     Built to sit behind the symbols the way the genre does it: softer, lighter and less saturated than the
     symbols, thin low-contrast outlines, a glow behind the grid so the reels pull focus, and all the busy
     decoration (curtains, table, chandelier) pushed to the edges of the screen. -->
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2A3758"/><stop offset="0.6" stop-color="#1F2A47"/><stop offset="1" stop-color="#161E35"/>
  </linearGradient>
  <radialGradient id="glow" cx="540" cy="700" r="560" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#F2A93B" stop-opacity="0.42"/><stop offset="0.55" stop-color="#F2A93B" stop-opacity="0.14"/><stop offset="1" stop-color="#F2A93B" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#162746"/><stop offset="1" stop-color="#101C36"/>
  </linearGradient>
  <linearGradient id="curtainL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5E1626"/><stop offset="1" stop-color="#9C2F3F"/>
  </linearGradient>
  <linearGradient id="curtainR" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#5E1626"/><stop offset="1" stop-color="#9C2F3F"/>
  </linearGradient>
  <linearGradient id="carpet" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9C2F3F"/><stop offset="1" stop-color="#6E1F2E"/>
  </linearGradient>
  <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8A5A3A"/><stop offset="1" stop-color="#6B4128"/>
  </linearGradient>
</defs>

<!-- back wall with soft panels -->
<rect width="1080" height="1920" fill="url(#wall)"/>
<g fill="#3A4A72" opacity="0.5">
  <rect x="130" y="180" width="70" height="1300" rx="35"/><rect x="250" y="180" width="70" height="1300" rx="35"/>
  <rect x="760" y="180" width="70" height="1300" rx="35"/><rect x="880" y="180" width="70" height="1300" rx="35"/>
</g>

<!-- glow behind the grid -->
<rect width="1080" height="1920" fill="url(#glow)"/>

<!-- the summit screen: a soft world map in an arch, centred behind the reels -->
<path d="M270 1180 L270 560 Q270 270 540 270 Q810 270 810 560 L810 1180 Z" fill="url(#screen)" stroke="#B88A2E" stroke-width="10" opacity="0.85"/>
<g fill="none" stroke="#2C4672" stroke-width="3" opacity="0.9">
