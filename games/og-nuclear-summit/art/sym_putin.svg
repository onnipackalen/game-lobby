<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250">
<style>.ol{stroke:#3b2a22;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.il{fill:none;stroke:#3b2a22;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}</style>
<!-- Shirtless Vlad. Head and bare shoulders, front view, cel-shaded.
     Identity from his public look: wide cheekbones tapering to a small pointed chin, pointed ears,
     thin light-brown hair combed across a receding line, pale blue eyes under heavy drooping lids,
     brows raised at the inner ends, a small pouty pressed mouth, bare strongman shoulders. -->
<!-- tier tile -->
<path class="ol" d="M100.0 20.0 L190.1 72.0 L190.1 176.0 L100.0 228.0 L9.9 176.0 L9.9 72.0 Z" fill="#2F5FD0"/>
<ellipse cx="78" cy="62" rx="48" ry="26" fill="#6E93EC" opacity="0.45"/>
<!-- bare shoulders and chest -->
<path class="ol" d="M4 250 Q8 206 46 192 Q72 184 100 186 Q130 184 156 192 Q194 206 196 250 Z" fill="#EFC9A8"/>
<path d="M130 188 Q170 196 190 226 L196 250 L150 250 Q156 220 128 200 Z" fill="#D6A884"/>
<path class="il" d="M50 206 Q74 210 92 202 M108 202 Q128 210 152 206"/>
<path class="il" d="M44 242 Q70 232 96 238 M104 238 Q130 232 158 242 M100 214 L100 234" style="stroke:#a87b5a"/>
<path class="il" d="M26 222 Q34 208 50 204 M174 222 Q166 208 150 204" style="stroke:#a87b5a"/>
<!-- neck -->
<path d="M80 158 L78 194 Q100 204 126 194 L124 158 Z" fill="#E3B994"/>
<path class="il" d="M78 160 L78 192 M124 158 L126 192"/>
<path class="il" d="M88 168 L93 194 M114 168 L109 194" style="stroke:#a87b5a"/>
<!-- pointed ears -->
<path class="ol" d="M58 104 L34 66 Q28 100 42 128 Q50 140 60 136 Z" fill="#EFC9A8"/>
<path class="il" d="M50 92 Q40 106 46 124" style="stroke:#a87b5a"/>
<path class="ol" d="M142 104 L166 66 Q172 100 158 128 Q150 140 140 136 Z" fill="#EFC9A8"/>
<path class="il" d="M150 92 Q160 106 154 124" style="stroke:#a87b5a"/>
<!-- head: wide cheekbones tapering to a small pointed chin -->
<path d="M56 74 Q58 30 100 24 Q142 30 144 74 Q150 100 146 124 Q142 148 128 166 Q114 182 100 186 Q86 182 72 166 Q58 148 54 124 Q50 100 56 74 Z" fill="#F0C9A6"/>
<!-- puffy-cheek shading -->
<path d="M54 124 Q60 150 76 168 L82 158 Q66 146 62 124 Z" fill="#D6A884"/>
<path d="M146 124 Q140 150 124 168 L118 158 Q134 146 138 124 Z" fill="#D6A884"/>
<path d="M98 112 Q97 130 94 142 L100 144 Q101 130 103 112 Z" fill="#D6A884"/>
