<path d="M68 112 Q80 106 92 111 Q80 117 68 112 Z" fill="#F4EEE6"/>
<circle cx="81" cy="111.5" r="4.2" fill="#8FB3CF"/><circle cx="81" cy="111.5" r="1.7" fill="#22242a"/><circle cx="82.2" cy="110.3" r="0.9" fill="#ffffff"/>
