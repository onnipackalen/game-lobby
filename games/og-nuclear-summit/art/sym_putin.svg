<ellipse cx="100" cy="44" rx="22" ry="7" fill="#FBE6D3"/>
<path class="ol" d="M56 74 Q58 30 100 24 Q142 30 144 74 Q150 100 146 124 Q142 148 128 166 Q114 182 100 186 Q86 182 72 166 Q58 148 54 124 Q50 100 56 74" fill="none"/>
<!-- thin, receding light-brown hair combed across -->
<path d="M58 74 Q58 36 98 26 Q138 28 144 70 Q138 50 120 44 Q100 38 82 46 Q66 54 58 74 Z" fill="#C7A77C" opacity="0.9"/>
<path d="M62 62 Q84 40 132 40 M66 54 Q92 36 128 34 M120 44 Q136 50 142 64" stroke="#A88A60" stroke-width="1.8" stroke-linecap="round" fill="none"/>
<!-- forehead and the worried crease -->
<path class="il" d="M72 76 Q100 70 128 76 M78 84 Q100 80 122 84 M98 90 Q99 96 98 100" style="stroke:#c79c7a;stroke-width:1.4"/>
<!-- thin brows, raised at the inner ends -->
<path d="M64 102 Q78 98 92 93 M108 93 Q122 98 136 102" stroke="#A88A60" stroke-width="3.4" stroke-linecap="round" fill="none"/>
