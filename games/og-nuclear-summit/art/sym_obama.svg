<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250">
<style>.ol{stroke:#3b2a22;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.il{fill:none;stroke:#3b2a22;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}</style>
<!-- No-drama Obama. Head and shoulders, 3/4 view facing left, cel-shaded.
     Identity: close-cropped dark hair greying at the temples, jug ears (his own favourite joke about himself),
     slim face, wide pleased-with-himself grin, the famous tan suit.
     Face and features drawn with the same proportions as every other leader. -->
<!-- tier tile -->
<circle class="ol" cx="100" cy="120" r="94" fill="#F2C94C"/>
<ellipse cx="78" cy="62" rx="48" ry="26" fill="#FFE69A" opacity="0.45"/>
<!-- the tan suit -->
<path class="ol" d="M4 250 Q8 212 44 200 Q72 192 100 194 Q132 192 158 200 Q194 212 196 250 Z" fill="#C9AE82"/>
<path d="M140 196 Q178 206 192 232 L196 250 L160 250 Q164 222 136 206 Z" fill="#B0956A"/>
<path d="M78 172 L78 198 L120 198 L122 172 Z" fill="#8C5E3D"/>
<path class="ol" d="M76 196 L98 226 L122 194 L118 188 L98 210 L82 188 Z" fill="#FFFFFF" style="stroke-width:2.2"/>
<path class="il" d="M76 196 L64 250 M122 194 L132 250" style="stroke:#8a6f45"/>
<path class="ol" d="M92 208 L104 208 L102 218 L94 218 Z" fill="#2459B5" style="stroke-width:2"/>
<path class="ol" d="M94 218 L102 218 L108 250 L88 250 Z" fill="#2F6FD6" style="stroke-width:2"/>
<!-- jug ears: far ear sticking out, near ear even bigger -->
<path class="ol" d="M60 104 Q36 90 32 114 Q31 140 58 140 Z" fill="#A8754F"/>
<path class="il" d="M44 108 Q38 118 44 132" style="stroke:#6e4529"/>
<path class="ol" d="M148 96 Q186 78 192 116 Q196 152 156 158 Z" fill="#A8754F"/>
<path class="il" d="M162 104 Q178 116 168 144" style="stroke:#6e4529"/>
<!-- slim face -->
<path d="M60 80 Q58 40 100 30 Q142 26 156 62 Q162 90 158 120 L156 142 Q152 168 132 182 Q116 192 98 190 Q78 188 68 172 L60 152 Q54 140 56 128 L58 114 Q56 96 60 80 Z" fill="#A8754F"/>
