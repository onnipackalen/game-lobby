<path d="M158 116 Q156 146 144 166 Q132 182 116 188 L114 178 Q132 166 140 146 Q148 128 148 110 Z" fill="#8C5E3D"/>
<path d="M92 110 Q96 126 98 142 L92 144 Q92 126 90 110 Z" fill="#8C5E3D"/>
<ellipse cx="78" cy="132" rx="10" ry="6" fill="#BE8A62" opacity="0.8"/>
<ellipse cx="88" cy="68" rx="18" ry="5" fill="#BE8A62" opacity="0.7"/>
<!-- face outline over the shading -->
<path class="ol" d="M60 80 Q58 40 100 30 Q142 26 156 62 Q162 90 158 120 L156 142 Q152 168 132 182 Q116 192 98 190 Q78 188 68 172 L60 152 Q54 140 56 128 L58 114 Q56 96 60 80" fill="none"/>
