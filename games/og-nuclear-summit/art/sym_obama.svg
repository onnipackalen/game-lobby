<path class="ol" d="M60 84 Q56 42 100 30 Q142 26 156 62 Q158 72 156 84 Q150 64 132 58 Q110 52 90 56 Q72 62 64 78 Z" fill="#2E2A2A" style="stroke-width:2.4"/>
<path d="M140 62 Q152 70 155 82 L150 80 Q146 70 138 66 Z M64 76 Q66 66 74 62 L76 66 Q70 70 68 78 Z" fill="#9A9A9E"/>
<g fill="#5A5658"><circle cx="96" cy="40" r="1.6"/><circle cx="112" cy="38" r="1.6"/><circle cx="126" cy="42" r="1.6"/><circle cx="104" cy="48" r="1.6"/><circle cx="120" cy="50" r="1.6"/><circle cx="84" cy="48" r="1.6"/><circle cx="138" cy="50" r="1.6"/></g>
<!-- friendly raised brows -->
<path d="M64 98 Q76 92 88 96 M104 96 Q118 90 132 95" stroke="#1F1A18" stroke-width="3.6" stroke-linecap="round" fill="none"/>
